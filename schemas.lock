# schemas.lock — which behaverse/schemas artifacts the BDM site fetches.
# Read by scripts/build_spec.py.
#
# We fetch the *current* field-definitions.json from the canonical schemas site. While the
# schemas evolve rapidly (and BDM is their only consumer), pins are unversioned and content
# hashes are omitted — the build simply tracks current. To freeze a release later, add a
# `field_definitions_sha256` under a pin and build_spec will verify it.
source:
  url_template: "https://behaverse.org/schemas/{name}/field-definitions.json"

# Human "full reference" link target on generated pages (the Docusaurus docs site).
docs_base_url: https://behaverse.org/schemas

# Cross-cutting terminology (behaverse/schemas vocabulary/). Merged with field terms
# harvested from the pinned schemas into the generated glossary (glossary/glossary.yml).
# Tracks current, like the pins; add `sha256` to freeze.
vocabulary:
  url: "https://behaverse.org/schemas/vocabulary/terms.jsonld"

# `version` is informational (the upstream version last synced against). It is only
# substituted into the fetch URL if url_template contains a {version} placeholder —
# the canonical template above does not, so builds track current content.
# `aliases` (optional): pre-generation URLs the generated index page must keep alive.
pins:
  trial:
    version: v26.0809
  event:
    version: v26.0808
  studyflow:
    version: v26.0803
  timeseries:
    version: v26.0809
    aliases: ["/spec/timeseries.html"]
  agents:
    version: v26.0804
